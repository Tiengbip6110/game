<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- 0. Phát hiện DevTools sớm nhất — chặn trước khi tải source -->
  <script>
    (function() {
      if (/(googlebot|baiduspider|bingbot|applebot|yandexbot|bytespider)/i.test(navigator.userAgent)) return;
      var dpr = window.devicePixelRatio || 1;
      var wDiff = window.outerWidth - window.innerWidth * dpr;
      var hDiff = window.outerHeight - window.innerHeight * dpr;
      var sizeHit = wDiff > 200 || hDiff > 300;
      var dbgHit = false;
      var t0 = performance.now();
      (function(){}).constructor('debugger')();
      dbgHit = (performance.now() - t0) > 100;
      if (sizeHit || dbgHit) {
        window.stop();
        document.documentElement.innerHTML = '';
        window.history.back();
        setTimeout(function() { window.location.replace('about:blank'); }, 300);
      }
    })();
  </script>

  <!-- Domain lock + multi-layer protection -->
  <script src="protect.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0118" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ngày của đôi ta - Love Link</title>

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/logo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/logo-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/logo-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Caveat:wght@400;500;600;700&family=Pinyon+Script&family=Pacifico&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Three.js (import map cho ES modules) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="acts/act1_intro.css" />
  <link rel="stylesheet" href="acts/act2_book.css" />
  <link rel="stylesheet" href="acts/act4_galaxy.css" />

  <!-- ─── Loading & error screen styles (inline, không phụ thuộc CSS chính) ─── -->
  <style>
    /* Loading overlay — hiện trong lúc chờ Firebase */
    #u-loading {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: radial-gradient(ellipse at center, #1f0838 0%, #0e0420 40%, #07020f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: "Cormorant Garamond", Georgia, serif;
      transition: opacity .7s ease;
    }
    #u-loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    #u-loading-ring {
      width: 84px; height: 84px;
      position: relative;
      margin-bottom: 24px;
    }
    #u-loading-ring svg { width: 100%; height: 100%; }
    @keyframes uLoaderSpin {
      0%   { stroke-dashoffset: 0;    transform: rotate(0); }
      100% { stroke-dashoffset: -214; transform: rotate(540deg); }
    }
    #u-loading-title {
      font-family: "Cinzel", "Cormorant Garamond", serif;
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #ffd17a;
      text-shadow: 0 0 30px rgba(255, 209, 122, 0.4);
      margin-bottom: 10px;
      text-align: center;
    }
    #u-loading-sub {
      font-style: italic;
      font-size: clamp(14px, 1.6vw, 17px);
      color: rgba(255,247,251,.62);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    #u-loading-hint {
      font-size: 12px;
      color: rgba(255,247,251,.32);
      letter-spacing: 0.08em;
    }

    /* Error screen — hiện khi customer invalid */
    #u-error {
      position: fixed;
      inset: 0;
      z-index: 9500;
      background: #0a0a0f;
      color: #f0eeff;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    #u-error h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #ff8eb8;
      margin-bottom: .6rem;
    }
    #u-error p {
      color: #7a7890;
      font-size: 14px;
      line-height: 1.7;
    }
    #u-error-icon {
      font-size: 3.5rem;
      margin-bottom: 1.25rem;
      opacity: .25;
      color: #ff8eb8;
    }
  </style>
</head>
<body>

  <!-- ═══ LOADING SCREEN (CSS-only, hiện ngay) ═══ -->
  <div id="u-loading">
    <div id="u-loading-ring">
      <svg viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="42" cy="42" r="36" stroke="rgba(255, 209, 122, 0.12)" stroke-width="1.2"/>
        <circle cx="42" cy="42" r="36" stroke="url(#uG1)" stroke-width="1.5"
                stroke-dasharray="60 154" stroke-linecap="round"
                style="animation:uLoaderSpin 1.6s cubic-bezier(.6,.15,.35,.85) infinite; transform-origin:center"/>
        <circle cx="42" cy="42" r="26" stroke="rgba(255, 142, 184, 0.18)" stroke-width="0.8"/>
        <circle cx="42" cy="42" r="26" stroke="url(#uG2)" stroke-width="1.0"
                stroke-dasharray="40 124" stroke-linecap="round"
                style="animation:uLoaderSpin 2.2s cubic-bezier(.6,.15,.35,.85) infinite reverse; transform-origin:center"/>
        <defs>
          <linearGradient id="uG1" x1="0" y1="0" x2="84" y2="84" gradientUnits="userSpaceOnUse">
            <stop offset="0%"  stop-color="#ffd17a"/>
            <stop offset="100%" stop-color="#ff8eb8"/>
          </linearGradient>
          <linearGradient id="uG2" x1="84" y1="0" x2="0" y2="84" gradientUnits="userSpaceOnUse">
            <stop offset="0%"  stop-color="#ff6b9d"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div id="u-loading-title">Universe of Us</div>
    <div id="u-loading-sub">Đang chuẩn bị vũ trụ của đôi ta…</div>
    <div id="u-loading-hint">Preparing your universe</div>
  </div>

  <!-- ═══ NỀN VŨ TRỤ XUYÊN SUỐT (sao nhấp nháy) ═══ -->
  <canvas id="bg-stars" aria-hidden="true"></canvas>

  <!-- ═══ ÂM NHẠC NỀN ═══ -->

  <button id="music-toggle" aria-label="Bật/tắt nhạc" title="Bật/tắt nhạc">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
  </button>

  <!-- ═══ STAGE — nơi các Act mount/unmount ═══ -->
  <main id="stage"></main>

  <!-- ═══ TRANSITION VEIL ═══ -->
  <div id="transition-veil" aria-hidden="true">
    <div class="veil-core"></div>
  </div>

  <!-- ═══ Firebase SDK (compat) — cần load TRƯỚC firebase-shared.js ═══ -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- ═══ firebase-shared.js — Helpers + đọc CUSTOMER_ID từ URL ═══ -->
  <script src="firebase-shared.js"></script>

  <!-- ═══ Validator + Data Loader + Boot main.js ═══ -->
  <script type="module">
    /* ── Hàm hiện màn hình lỗi (link không tồn tại) ── */
    function showLinkExpired() {
      var loading = document.getElementById('u-loading');
      if (loading) loading.remove();
      var err = document.createElement('div');
      err.id = 'u-error';
      err.innerHTML = ''
        + '<div>'
        +   '<div id="u-error-icon">✦</div>'
        +   '<h1>Liên kết không tồn tại</h1>'
        +   '<p>Trang này đã bị xóa hoặc chưa được kích hoạt.<br>'
        +   'Vui lòng liên hệ người tạo link.</p>'
        + '</div>';
      document.body.appendChild(err);
    }

    /* ── Watermark cho bản xem trước (giống Galaxy) ── */
    function injectWatermark() {
      if (!window.IS_PREVIEW) return;
      var id = '_uwm_' + Math.random().toString(36).substr(2, 6);

      var css = document.createElement('style');
      css.textContent = [
        '#' + id + '{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;}',
        '#' + id + ' .uwm-inner{position:absolute;top:-50%;left:-50%;width:200%;height:200%;',
        '  display:flex;flex-wrap:wrap;align-content:flex-start;',
        '  transform:rotate(-28deg);gap:60px 40px;',
        '  animation:uwmDrift 20s linear infinite;}',
        '@keyframes uwmDrift{0%{transform:rotate(-28deg) translate(0,0)}',
        '  100%{transform:rotate(-28deg) translate(-80px,80px)}}',
        '#' + id + ' .uwm-line{white-space:nowrap;width:100%;',
        '  font:600 clamp(13px,2.2vw,18px) sans-serif;',
        '  letter-spacing:.18em;text-transform:uppercase;',
        '  color:rgba(255,255,255,.12);',
        '  text-shadow:0 0 8px rgba(255,142,184,.18);',
        '  user-select:none;}',
        '#' + id + ' .uwm-line:nth-child(even){color:rgba(255,142,184,.16);}',
      ].join('');
      document.head.appendChild(css);

      function create() {
        var el = document.getElementById(id);
        if (el) el.remove();
        el = document.createElement('div');
        el.id = id;
        var inner = '<div class="uwm-inner">';
        var t1 = 'Bản xem trước · Chưa thanh toán · ';
        var t2 = 'Preview · Unpaid · ';
        for (var i = 0; i < 60; i++) {
          inner += '<div class="uwm-line">' + (i % 2 === 0 ? t1 : t2).repeat(8) + '</div>';
        }
        inner += '</div>';
        el.innerHTML = inner;
        document.body.appendChild(el);
      }
      create();
      // Tự tái tạo nếu bị xóa khỏi DOM
      setInterval(function() {
        if (!document.getElementById(id)) create();
      }, 800);
    }

    /* ──────────────────────────────────────────────
       MAIN BOOT FLOW
       1) Chặn ngay nếu không có ?id= hoặc id=default
       2) Validate customer doc (token nếu preview)
       3) Fetch images + song + custom fields
       4) Build window.FIREBASE_DATA
       5) Inject watermark nếu preview
       6) Hide loading + dynamic import main.js
       ────────────────────────────────────────────── */
    async function boot() {
      // Bước 1: validate URL
      if (!window.CUSTOMER_ID || window.CUSTOMER_ID === 'default') {
        showLinkExpired();
        return;
      }

      try {
        // Bước 2: fetch customer doc
        var doc = await window._db.collection('customers').doc(window.CUSTOMER_ID).get();
        if (!doc.exists) { showLinkExpired(); return; }

        var data = doc.data() || {};

        // Bản nháp/chờ-thanh-toán → bắt buộc token đúng
        if (data.status !== 'paid') {
          if (!data.previewToken || data.previewToken !== window.PREVIEW_TOKEN) {
            showLinkExpired();
            return;
          }
          window.IS_PREVIEW = true;
        }

        // Bước 3: fetch images + song song song
        var [imgs, song] = await Promise.all([
          window.fsGetImages().catch(function() { return []; }),
          window.fsGetSong('ourday').catch(function() { return null; }),
        ]);

        // Fallback nhạc nếu user chưa pick (cùng pattern với Galaxy)
        if (!song && window.SONGS && window.SONGS.length) {
          song = window.SONGS[0].file;
        }

        // Bước 4: build FIREBASE_DATA — map customer doc fields → DATA structure
        var letters = Array.isArray(data.letters) ? data.letters : [];
        var phrases = Array.isArray(data.phrases) ? data.phrases : [];
        var caps    = Array.isArray(data.plate_captions) ? data.plate_captions : [];

        // Hue + pattern cho plates: cycle qua các giá trị thẩm mỹ
        var HUES     = [340, 280, 350, 320, 300, 360, 290, 330, 270, 310];
        var PATTERNS = ['heart', 'sky', 'rose'];

        var plates = imgs.map(function(img, i) {
          var cap = caps[i] || {};
          return {
            name:    (cap.name && cap.name.trim())       || ('Kỷ niệm #' + (i + 1)),
            message: (cap.message && cap.message.trim()) || 'Một khoảnh khắc đáng nhớ trong vũ trụ của chúng ta.',
            src:     cloudinaryDeliver(img.url),
            hue:     HUES[i % HUES.length],
            pattern: PATTERNS[i % PATTERNS.length],
          };
        });

        window.FIREBASE_DATA = {
          intro: {
            topic:         data.intro_topic     || 'Happy Anniversary',
            recipientName: data.intro_recipient || 'Em yêu',
          },
          book: {
            pages: letters
              .filter(function(l) { return l && ((l.text && l.text.trim()) || l.img_url); })
              .map(function(l) {
                return {
                  text:  (l.text || '').trim(),
                  image: l.img_url ? cloudinaryDeliver(l.img_url) : '',
                };
              }),
          },
          galaxy: {
            plates:  plates,
            phrases: phrases.map(function(p) { return (p || '').toString().trim(); })
                            .filter(function(p) { return p.length > 0; }),
          },
          heart: {
            heartColor: data.heart_color || '#ff1493',
          },
          audio: {
            src:    song ? cloudinaryDeliver(song) : '',
            volume: 1.0,
          },
        };

        // Bước 5: watermark cho preview
        if (window.IS_PREVIEW) injectWatermark();

        // Bước 6: ẩn loading + dynamic import main.js
        var loading = document.getElementById('u-loading');
        if (loading) {
          loading.classList.add('hide');
          setTimeout(function() {
            if (loading.parentNode) loading.parentNode.removeChild(loading);
          }, 700);
        }

        await import('./main.js');

      } catch (err) {
        console.warn('Universe boot error:', err);
        showLinkExpired();
      }
    }

    boot();
  </script>

  <!-- ═══ Bảo vệ DevTools nâng cao (thư viện disable-devtool) ═══ -->
  <script src="detect-devtools.js"></script>
  <script>
    (function() {
      if (typeof DisableDevtool !== 'function') return;
      /* Bỏ qua nếu đang dev local */
      var h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1' || location.port !== '') return;

      DisableDevtool({
        disableMenu: true,
        disableSelect: false,
        disableCopy: true,
        disableCut: true,
        disablePaste: false,
        clearLog: true,
        interval: 1000,
        seo: true,
        clearIntervalWhenDevOpenTrigger: true,
        ondevtoolopen: function() {
          try { document.documentElement.innerHTML = ''; } catch(e) {}
          window.history.back();
          setTimeout(function() { window.location.replace('about:blank'); }, 300);
        }
      });
    })();
  </script>
</body>
